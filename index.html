<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #000; color: #fff; padding-bottom: 140px; overflow-x: hidden; }
        .app { max-width: 480px; margin: 0 auto; position: relative; }
        
        /* 顶部栏 */
        .top-bar { display: flex; justify-content: space-between; padding: 15px 20px; position: sticky; top: 0; background: #000; z-index: 100; }
        .top-bar div { display: flex; gap: 20px; }
        .icon { width: 24px; height: 24px; fill: #fff; cursor: pointer; }
        
        /* 用户信息 */
        .user-info { display: flex; flex-direction: column; align-items: center; padding: 20px 0; }
        /* 注意这里，改成了 img 标签的样式 */
        .avatar { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; background: #333; margin-bottom: 15px; border: 1px solid #333; }
        .name { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        .tag { font-size: 12px; background: #333; padding: 2px 6px; border-radius: 10px; margin-left: 5px; font-weight: normal; }
        .sign { font-size: 12px; color: #888; margin-bottom: 15px; }
        .stats { display: flex; gap: 15px; font-size: 13px; color: #888; margin-bottom: 20px; }
        .stats span { color: #fff; }
        
        /* 按钮 */
        .btns { display: flex; gap: 10px; padding: 0 20px; }
        .btn { flex: 1; background: #1a1a1a; border: none; color: #fff; padding: 8px 0; border-radius: 20px; font-size: 13px; cursor: pointer; }
        
        /* 卡片 */
        .cards-wrap { padding: 20px 0 20px 20px; }
        .cards { display: flex; overflow-x: auto; gap: 15px; padding-right: 20px; scrollbar-width: none; }
        .cards::-webkit-scrollbar { display: none; }
        .card { flex: 0 0 auto; width: 100px; text-align: center; }
        /* 图片卡片样式 */
        .card-img { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; background: #222; margin-bottom: 8px; border: 1px solid #333; }
        .card-text { font-size: 12px; color: #ccc; }
        
        /* 音乐列表 */
        .music-list { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .music-item { display: flex; align-items: center; background: #111; padding: 10px; border-radius: 10px; cursor: pointer; }
        /* 音乐封面图片样式 */
        .music-cover { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; background: #333; margin-right: 15px; flex-shrink: 0; }
        .music-name { font-size: 15px; margin-bottom: 5px; }
        .music-desc { font-size: 12px; color: #888; }
        
        /* 底部播放条 */
        .player { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(30,30,30,0.95); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; z-index: 100; }
        .player-left { display: flex; align-items: center; gap: 10px; overflow: hidden;}
        /* 播放条封面图片样式 */
        .player-cover { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; background: #555; flex-shrink: 0;}
        .player-info { display: flex; flex-direction: column; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;}
        .player-title { font-size: 14px; }
        .player-artist { font-size: 12px; color: #888; }
        .play-btn { width: 32px; height: 32px; border-radius: 50%; background: #333; border: 1px solid #555; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;}
        .icon-play { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid #fff; margin-left: 3px; }
        .icon-pause { display: none; width: 10px; height: 12px; border-left: 3px solid #fff; border-right: 3px solid #fff; }
        
        /* 底部导航 */
        .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #000; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; z-index: 100; }
        .nav-item { color: #666; font-size: 14px; cursor: pointer; }
        .nav-item.active { color: #fff; font-weight: bold; }
        
        /* 页面切换 */
        .page { display: none; }
        .page.active { display: block; }
        .other-page { padding: 50px 20px; text-align: center; color: #888; }
    </style>
</head>
<body>

<audio id="myAudio"></audio>

<div class="app">
    <!-- 顶部 -->
    <div class="top-bar">
        <div><svg class="icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
        <div>
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            <svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </div>

    <!-- 页面1：我的 -->
    <div id="page-我的" class="page active">
        <div class="user-info">
            <!-- 把图片链接直接放在 src="" 的双引号里面 -->
            <img src=https://raw.githubusercontent.com/Duskvei/X/main/微信图片_20261024212932_17_2.jpg>
            
            <div class="name">余祉 <span class="tag">SVIP·柒</span></div>
            <div class="sign">我叹缘分浅浅如雨渐渐</div>
            <div class="stats">
                <div><span>52</span> 关注</div>
                <div><span>13140</span> 粉丝</div>
                <div><span>Lv.12</span></div>
                <div><span>5200</span> 小时</div>
            </div>
        </div>

        <div class="btns">
            <button class="btn">最近</button>
            <button class="btn">本地</button>
            <button class="btn">云贝</button>
            <button class="btn">装扮</button>
        </div>

        <div class="cards-wrap">
            <div class="cards">
                <!-- 把卡片图片链接放在 src="" 里面 -->
                <div class="card"><img src="" class="card-img" alt="图片1"><div class="card-text">Despair</div></div>
                <div class="card"><img src="" class="card-img" alt="图片2"><div class="card-text">Isolation</div></div>
                <div class="card"><img src="" class="card-img" alt="图片3"><div class="card-text">Sorrow</div></div>
                <div class="card"><img src="" class="card-img" alt="图片4"><div class="card-text">Melancholy</div></div>
                <div class="card"><img src="" class="card-img" alt="图片5"><div class="card-text">Agony</div></div>
            </div>
        </div>

        <div class="music-list">
            <!-- 注意这里的封面和音频也是一样，换链接进去 -->
            <div class="music-item" onclick="playMusic('', '我喜欢的音乐', '歌手A', '')">
                <img src="" class="music-cover" alt="封面1">
                <div>
                    <div class="music-name">我喜欢的音乐</div>
                    <div class="music-desc">1680首 · 8344次播放</div>
                </div>
            </div>
            <div class="music-item" onclick="playMusic('', 'Despair', '歌手B', '')">
                <img src="" class="music-cover" alt="封面2">
                <div>
                    <div class="music-name">Despair</div>
                    <div class="music-desc">点击播放</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 其他页面 -->
    <div id="page-价格" class="page"><div class="other-page">这里是风格页面内容</div></div>
    <div id="page-须知" class="page"><div class="other-page">这里是须知页面内容</div></div>
    <div id="page-过往" class="page"><div class="other-page">这里是过往页面内容</div></div>

    <!-- 底部播放条 -->
    <div class="player">
        <div class="player-left">
            <img id="p-cover" class="player-cover" src="" alt="封面">
            <div class="player-info">
                <div class="player-title" id="p-title">暂无播放</div>
                <div class="player-artist" id="p-artist">请选择音乐</div>
            </div>
        </div>
        <div class="play-btn" onclick="togglePlay()">
            <div class="icon-play" id="i-play"></div>
            <div class="icon-pause" id="i-pause"></div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="nav">
        <div class="nav-item active" onclick="switchTab('我的', this)">我的</div>
        <div class="nav-item" onclick="switchTab('价格', this)">风格</div>
        <div class="nav-item" onclick="switchTab('须知', this)">须知</div>
        <div class="nav-item" onclick="switchTab('过往', this)">过往</div>
    </div>
</div>

<script>
    // 页面切换逻辑
    function switchTab(tabName, el) {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tabName).classList.add('active');
    }

    // 音乐播放逻辑
    let isPlaying = false;
    const audio = document.getElementById('myAudio');

    // 这里的 cover 参数就是图片链接，现在通过 .src 赋给 img 标签
    function playMusic(cover, title, artist, src) {
        if(cover) document.getElementById('p-cover').src = cover;
        document.getElementById('p-title').innerText = title;
        document.getElementById('p-artist').innerText = artist;
        
        if(src) {
            audio.src = src;
            audio.play().then(() => {
                isPlaying = true; updateUI();
            }).catch(() => {
                isPlaying = true; updateUI(); 
            });
        }
    }

    function togglePlay() {
        if (document.getElementById('p-title').innerText === '暂无播放') {
            return;
        }
        if (isPlaying) { audio.pause(); isPlaying = false; } 
        else { audio.play().catch(()=>{}); isPlaying = true; }
        updateUI();
    }

    function updateUI() {
        document.getElementById('i-play').style.display = isPlaying ? 'none' : 'block';
        document.getElementById('i-pause').style.display = isPlaying ? 'block' : 'none';
    }
</script>
</body>
</html>
